name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project FWPlayerRemote.xcodeproj \
            -scheme FWPlayerRemote \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  tests:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test

  protocol-sync:
    name: Protocol matches FWPlayer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Informational: the wire protocol is kept byte-identical in both repos. This
    # is expected to differ on a PR that changes it until the other repo's
    # matching change is merged, so it never blocks the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Compare with FWPlayer main
        run: |
          status=0
          for f in RemoteProtocol.swift RemoteLink.swift; do
            curl -fsSL "https://raw.githubusercontent.com/mrnoh99/FWPlayer/main/Sources/Protocol/$f" -o "/tmp/other-$f"
            if ! diff -u "/tmp/other-$f" "Sources/Protocol/$f"; then
              echo "::warning::$f differs from FWPlayer main — copy the change to both repos"
              status=1
            fi
          done
          exit $status
